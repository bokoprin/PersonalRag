[package]
name = "personalrag-tauri"
version = "0.1.0"
description = "PersonalRag GUI connected directly to the Portable Search Core"
authors = ["PersonalRag"]
edition = "2021"
rust-version = "1.97"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
personalrag-gui-bridge-core = { path = "../bridge-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["custom-protocol"] }
