<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PersonalRag GUI Mock</title>
<style>
  :root{
    --bg:#f3f3f3;
    --panel:#ffffff;
    --border:#d4d4d4;
    --border-dark:#b8b8b8;
    --text:#1f1f1f;
    --muted:#6b6b6b;
    --selection:#cfe8ff;
    --selection-border:#7ab6ea;
    --input:#ffffff;
    --hover:#f4f8fb;
    --status:#f7f7f7;
    --accent:#0f6cbd;
    --warn:#a15c00;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:13px;
    overflow:hidden;
  }
  .app{
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--panel);
  }
  .titlebar{
    height:34px;
    display:flex;
    align-items:center;
    padding:0 10px;
    border-bottom:1px solid var(--border);
    background:#fafafa;
    font-size:12px;
    user-select:none;
  }
  .brand{font-weight:600}
  .titlebar .spacer{flex:1}
  .window-actions span{
    display:inline-block;
    width:34px;
    text-align:center;
    color:#555;
  }

  .search-area{
    padding:8px 10px 7px;
    border-bottom:1px solid var(--border);
    background:#fbfbfb;
  }
  .search-row{
    display:grid;
    grid-template-columns:90px minmax(260px,1fr) auto auto;
    align-items:center;
    gap:7px;
    min-height:30px;
  }
  .search-row + .search-row{margin-top:5px}
  .label{
    color:#333;
    white-space:nowrap;
  }
  input[type="text"], select{
    height:27px;
    border:1px solid var(--border-dark);
    background:var(--input);
    color:var(--text);
    font:inherit;
    padding:3px 7px;
    outline:none;
  }
  input[type="text"]:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(15,108,189,.18);
  }
  .file-input{
    font-size:14px;
  }
  .inline{
    display:flex;
    gap:6px;
    align-items:center;
    white-space:nowrap;
  }
  .check{
    display:flex;
    align-items:center;
    gap:4px;
    color:#333;
    user-select:none;
  }
  .check input{margin:0}
  select{min-width:104px}
  .clear-btn{
    height:27px;
    min-width:32px;
    border:1px solid var(--border-dark);
    background:#f8f8f8;
    cursor:pointer;
    border-radius:2px;
  }
  .clear-btn:hover{background:#ececec}

  .toolbar{
    height:34px;
    padding:0 10px;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--border);
    background:#fff;
    gap:10px;
  }
  .summary{color:#333}
  .summary strong{font-weight:600}
  .toolbar .spacer{flex:1}
  .more-btn{
    height:24px;
    padding:0 11px;
    border:1px solid var(--border-dark);
    background:#fafafa;
    cursor:pointer;
    border-radius:2px;
    font:inherit;
  }
  .more-btn:hover{background:#ececec}
  .more-btn:disabled{opacity:.45;cursor:default}

  .main{
    min-height:0;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .table-wrap{
    min-height:0;
    flex:1;
    overflow:auto;
    background:#fff;
    outline:none;
  }
  .table-wrap:focus{
    box-shadow:inset 0 0 0 1px rgba(15,108,189,.45);
  }
  table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
  }
  thead{
    position:sticky;
    top:0;
    z-index:2;
  }
  th{
    height:27px;
    text-align:left;
    font-weight:400;
    padding:4px 7px;
    background:#f5f5f5;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border-dark);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  td{
    height:25px;
    padding:3px 7px;
    border-bottom:1px solid #f0f0f0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  tbody tr{cursor:default}
  tbody tr:hover{background:var(--hover)}
  tbody tr.selected{
    background:var(--selection);
    outline:1px solid var(--selection-border);
    outline-offset:-1px;
  }
  .name-col{width:230px}
  .path-col{width:auto}
  .size-col{width:92px;text-align:right}
  .mod-col{width:150px}
  .hits-col{width:70px;text-align:right}
  .name-cell{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }
  .file-icon{
    width:14px;height:16px;
    border:1px solid #9aa7b1;
    background:linear-gradient(#fff,#eef3f7);
    border-radius:1px;
    flex:0 0 auto;
  }

  .preview{
    flex:0 0 190px;
    border-top:1px solid var(--border-dark);
    background:#fbfbfb;
    display:none;
    min-height:120px;
  }
  .preview.visible{display:flex;flex-direction:column}
  .preview-head{
    height:34px;
    display:flex;
    align-items:center;
    padding:0 10px;
    border-bottom:1px solid var(--border);
    background:#f7f7f7;
    gap:8px;
  }
  .preview-title{
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .preview-count{color:var(--muted)}
  .preview-head .spacer{flex:1}
  .nav-btn{
    height:23px;
    border:1px solid var(--border-dark);
    background:#fff;
    cursor:pointer;
    font:inherit;
    padding:0 8px;
    border-radius:2px;
  }
  .nav-btn:hover{background:#ececec}
  .preview-body{
    overflow:auto;
    padding:6px 10px 8px;
    font-family:Consolas,"Yu Gothic UI",monospace;
    line-height:1.45;
    outline:none;
  }
  .preview-body:focus{

    background:#fff;
  }
  .hit{

    margin-bottom:3px;
  }
  .hit.active{
    background:#eef6fd;
    border-left-color:var(--accent);
  }

    font-size:12px;
    margin-bottom:1px;
  }

function wildcardToRegex(pattern){
  const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, "\\$&")
    .replace(/\*/g, ".*")
    .replace(/\?/g, ".");
  return "^" + escaped + "$";
}

function everythingMatch(text, query, cs){
  query = query.trim();
  if (!query) return true;
  const flags = cs ? "" : "i";
  const tokens = query.split(/\s+/).filter(Boolean);
  return tokens.every(tok => {
    if (tok.includes("*") || tok.includes("?")){
      try { return new RegExp(wildcardToRegex(tok), flags).test(text); }
      catch { return false; }
    }
    return cs ? text.includes(tok) : text.toLowerCase().includes(tok.toLowerCase());
  });
}

function contentHits(file, query, mode, cs){
  if (!query) return [];
  const flags = cs ? "g" : "gi";
  let test;
  try{
    if (mode === "regex"){
      const r = new RegExp(query, flags);
      test = s => { r.lastIndex = 0; return r.test(s); };
    }else if(mode === "wildcard"){
      const r = new RegExp(query.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, "."), flags);
      test = s => { r.lastIndex = 0; return r.test(s); };
    }else{
      test = s => cs ? s.includes(query) : s.toLowerCase().includes(query.toLowerCase());
    }
  }catch(e){
    return {error:e.message, hits:[]};
  }
  return {hits:file.content.filter(([,text]) => test(text))};
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

    if(mode==="regex") source=query;
    else if(mode==="wildcard") source=query.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*?").replace(/\?/g,".");
    else source=query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re = new RegExp("(" + source + ")", cs ? "g" : "gi");
    return escapeHtml(text).replace(re, "<mark>$1</mark>");
  }catch{
    return escapeHtml(text);
  }
}

function runSearch(){
  const fq = fileQuery.value;
  const cq = contentQuery.value;
  const cs = caseSensitive.checked;
  const mode = contentMode.value;
  const contentActive = cq.length > 0;

  hitsHeader.style.display = contentActive ? "" : "none";
  preview.classList.toggle("visible", contentActive);

  let syntaxError = null;
  const matches = [];
  for(const f of files){
    const text = scope.value==="filename" ? f.name : f.path + "\\" + f.name;
    if(!everythingMatch(text, fq, cs)) continue;
    let hits = [];
    if(contentActive){
      const result = contentHits(f, cq, mode, cs);
      if(result.error){ syntaxError = result.error; break; }
      hits = result.hits;
      if(!hits.length) continue;
    }
    matches.push({...f, hits});
  }

  if(syntaxError){
    resultsBody.innerHTML = "";
    noResults.style.display = "block";
    noResults.textContent = "内容検索式エラー: " + syntaxError;
    summary.textContent = "検索式を確認してください";
    moreBtn.disabled = true;
    previewBody.innerHTML = '<div class="empty-preview">検索式が正しくありません。</div>';
    return;
  }

  noResults.textContent = "一致するファイルはありません。";
  const visible = matches.slice(0, displayLimit);
  visibleResults = visible;
  resultsBody.innerHTML = "";

  visible.forEach((f, idx)=>{
    const tr = document.createElement("tr");
    tr.dataset.index = idx;
    if(selected && selected.name===f.name && selected.path===f.path) tr.classList.add("selected");
    tr.innerHTML = `
      <td><div class="name-cell"><span class="file-icon"></span><span>${escapeHtml(f.name)}</span></div></td>
      <td title="${escapeHtml(f.path)}">${escapeHtml(f.path)}</td>
      <td class="size-col">${escapeHtml(f.size)}</td>
      <td>${escapeHtml(f.modified)}</td>
      ${contentActive ? `<td class="hits-col">${f.hits.length}</td>` : ""}
    `;
    tr.addEventListener("click", ()=>{
      selected = f; activeHit=0;
      $("tableWrap").focus();
      document.querySelectorAll("tbody tr").forEach(x=>x.classList.remove("selected"));
      tr.classList.add("selected");
      updatePreview();
    });
    tr.addEventListener("dblclick", ()=>{
      alert("モック: Open\\n" + f.path + "\\" + f.name);
    });
    resultsBody.appendChild(tr);
  });

  noResults.style.display = visible.length ? "none" : "block";
  moreBtn.disabled = matches.length <= displayLimit;

  const fakeMs = Math.max(1.8, Math.min(18.0, 2.3 + matches.length * 0.37 + (contentActive ? 3.1 : 0)));
  if(!fq && !cq){
    summary.textContent = "入力すると即時検索します";
  }else{
    summary.innerHTML = `<strong>${visible.length}</strong>件表示 · ${fakeMs.toFixed(1)} ms` +
      (matches.length > visible.length ? ` · さらに候補あり` : "");
  }

  if(contentActive){
    if(!visible.length){
      selected=null;
      previewTitle.textContent="—";
      previewCount.textContent="";
      previewBody.innerHTML='<div class="empty-preview">表示する一致内容はありません。</div>';
    }else{
      const stillVisible = visible.find(f => selected && f.name===selected.name && f.path===selected.path);
      if(!stillVisible){
        selected=visible[0]; activeHit=0;
      }else selected=stillVisible;
      document.querySelectorAll("tbody tr").forEach((tr,i)=>{
        if(selected && visible[i].name===selected.name && visible[i].path===selected.path) tr.classList.add("selected");
      });
      updatePreview();
    }
  }else{
    selected=null;
  }
}

function updatePreview(){
  if(!selected || !contentQuery.value){
    previewBody.innerHTML="";
    return;
  }
  const hits = selected.hits || [];
  if(activeHit >= hits.length) activeHit=0;
  previewTitle.textContent = selected.name;
  previewCount.textContent = `${hits.length} matches`;
  previewBody.innerHTML = hits.map(([loc,text],i)=>`
    <div class="hit ${i===activeHit?'active':''}" data-hit="${i}">
      <div class="hit-loc">${escapeHtml(loc)}</div>
      <div>${highlight(text, contentQuery.value, contentMode.value, caseSensitive.checked)}</div>
    </div>
  `).join("");

  previewBody.querySelectorAll(".hit").forEach(hitEl=>{
    hitEl.addEventListener("click", e=>{
      e.stopPropagation();
      activeHit = Number(hitEl.dataset.hit || 0);
      updatePreview();
      previewBody.focus();
    });
  });

  const active = previewBody.querySelector(".hit.active");
  if(active) active.scrollIntoView({block:"nearest"});
}

function selectedVisibleIndex(){
  if(!selected) return -1;
  return visibleResults.findIndex(f => f.name===selected.name && f.path===selected.path);
}

function selectVisibleResult(index, scroll=true){
  if(!visibleResults.length) return;
  index = Math.max(0, Math.min(index, visibleResults.length - 1));
  selected = visibleResults[index];
  activeHit = 0;

  const rows = [...resultsBody.querySelectorAll("tr")];
  rows.forEach((tr, i) => tr.classList.toggle("selected", i === index));

  if(scroll && rows[index]){
    rows[index].scrollIntoView({block:"nearest"});
  }
  updatePreview();
}

function moveResultSelection(delta){
  if(!visibleResults.length) return false;

  let index = selectedVisibleIndex();
  if(index < 0){
    index = delta >= 0 ? 0 : visibleResults.length - 1;
  }else{
    index = Math.max(0, Math.min(index + delta, visibleResults.length - 1));
  }

  selectVisibleResult(index);
  return true;
}

function changeHit(delta){
  if(!selected || !selected.hits || !selected.hits.length) return;
  activeHit = (activeHit + delta + selected.hits.length) % selected.hits.length;
  updatePreview();
}

[fileQuery, contentQuery].forEach(el => el.addEventListener("input", ()=>{displayLimit=8;runSearch();}));
[scope, caseSensitive, contentMode].forEach(el => el.addEventListener("change", ()=>{displayLimit=8;runSearch();}));

$("clearContent").addEventListener("click", ()=>{
  contentQuery.value="";
  contentQuery.focus();
  displayLimit=8;
  runSearch();
});
moreBtn.addEventListener("click", ()=>{
  displayLimit += 8;
  runSearch();
});
$("prevHit").addEventListener("click", ()=>changeHit(-1));
$("nextHit").addEventListener("click", ()=>changeHit(1));

previewBody.addEventListener("keydown", e=>{
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    e.preventDefault();
    e.stopPropagation();
    changeHit(e.key==="ArrowDown" ? 1 : -1);
    previewBody.focus();
    return;
  }
  if(e.key==="Home"){
    e.preventDefault();
    e.stopPropagation();
    if(selected && selected.hits && selected.hits.length){
      activeHit = 0;
      updatePreview();
      previewBody.focus();
    }
    return;
  }
  if(e.key==="End"){
    e.preventDefault();
    e.stopPropagation();
    if(selected && selected.hits && selected.hits.length){
      activeHit = selected.hits.length - 1;
      updatePreview();
      previewBody.focus();
    }
  }
});

document.addEventListener("keydown", e=>{
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==="f"){
    e.preventDefault(); contentQuery.focus(); contentQuery.select(); return;
  }
  if(e.ctrlKey && e.key.toLowerCase()==="f"){
    e.preventDefault(); fileQuery.focus(); fileQuery.select(); return;
  }

  const active = document.activeElement;
  const editing =
    active instanceof HTMLInputElement ||
    active instanceof HTMLSelectElement ||
    active instanceof HTMLButtonElement;

  if(e.key==="Escape" && active instanceof HTMLInputElement){
    active.value="";
    displayLimit=8;
    runSearch();
    return;
  }

  // 検索結果にフォーカスがある状態では ↑/↓ で前後のファイルへ移動。
  // 内容検索中はプレビューも選択ファイルへ連動する。
  if(!editing && (e.key==="ArrowDown" || e.key==="ArrowUp")){
    if(moveResultSelection(e.key==="ArrowDown" ? 1 : -1)){
      e.preventDefault();
      $("tableWrap").focus();
      return;
    }
  }

  if(e.key==="Enter" && selected && !editing){
    e.preventDefault();
    alert("モック: Open\n" + selected.path + "\\" + selected.name);
  }
});

runSearch();
fileQuery.focus();
</script>
</body>
</html>
