name: Apply Verify Base Clamp Fix

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'perf/verify-base-parallelism'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: perf/verify-base-parallelism
          fetch-depth: 0

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Apply clippy-compliant equivalent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('search-core/src/index.rs')
          text = path.read_text(encoding='utf-8')
          old = 'logical_cpus.max(1).min(VERIFY_WORKER_CAP)'
          new = 'logical_cpus.clamp(1, VERIFY_WORKER_CAP)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exact worker expression once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Targeted regression and clippy
        shell: bash
        run: |
          cargo fmt --manifest-path search-core/Cargo.toml -- --check
          cargo clippy --manifest-path search-core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path search-core/Cargo.toml verify_worker_count_scales_above_legacy_cap_and_stays_bounded
          cargo test --manifest-path search-core/Cargo.toml checksum_and_truncation_corruption_are_rejected
          cargo test --manifest-path search-core/Cargo.toml checksum_gate_rejects_corrupt_segment_before_adoption

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search-core/src/index.rs
          git commit -m 'verify_base並列度計算をclampへ整理してlintを解消'
          git push origin HEAD:perf/verify-base-parallelism
