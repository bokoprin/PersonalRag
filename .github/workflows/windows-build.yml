name: Windows build

on:
  push:
    branches:
      - feat/build-stage-diagnostics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Apply diagnostic v2 source transformation
        shell: pwsh
        run: |
          if (Test-Path ci/apply_diagnostic_v2.py) {
            python ci/apply_diagnostic_v2.py
            if ($LASTEXITCODE -ne 0) { throw "diagnostic v2 source transformation failed" }
            Remove-Item ci/apply_diagnostic_v2.py
            cargo fmt --manifest-path search-core/Cargo.toml
            cargo fmt --manifest-path bridge-core/Cargo.toml
            cargo fmt --manifest-path src-tauri/Cargo.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- ci/apply_diagnostic_v2.py search-core/src/builder.rs bridge-core/src/lib.rs bridge-core/src/windows_native_scanner.rs bridge-core/src/build_diagnostics.rs src-tauri/src/main.rs
            git commit -m "インデックス作成診断ログv2とscan内訳を追加"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "Diagnostic v2 source changes are already applied."
          }

      - name: Run targeted diagnostic tests
        shell: pwsh
        run: |
          cargo test --manifest-path bridge-core/Cargo.toml scan_breakdown_tests
          if ($LASTEXITCODE -ne 0) { throw "scan breakdown targeted test failed" }
          cargo test --manifest-path bridge-core/Cargo.toml build_diagnostics
          if ($LASTEXITCODE -ne 0) { throw "build diagnostics targeted test failed" }

      - name: Run full Windows verification and release build
        shell: powershell
        run: |
          .\scripts\verify-and-build-windows.ps1

      - name: Verify executable and calculate SHA-256
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\personalrag-tauri.exe"
          if (-not (Test-Path $exe)) {
            throw "Built executable not found: $exe"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "PERSONALRAG_EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PersonalRag Windows executable SHA-256: $hash" | Out-File -FilePath windows-build-info.txt -Encoding utf8
          "### Windows release build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- executable: ``personalrag-tauri.exe``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PersonalRag-Windows-x64
          path: |
            src-tauri/target/release/personalrag-tauri.exe
            windows-build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish build result marker
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $exe = "src-tauri\target\release\personalrag-tauri.exe"
          $hash = ""
          if (Test-Path $exe) {
            $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          }
          @(
            "status=$env:JOB_STATUS",
            "run_id=$env:RUN_ID",
            "commit=${{ github.sha }}",
            "exe_exists=$(Test-Path $exe)",
            "exe_sha256=$hash"
          ) | Set-Content -Path ci/windows-build-result.txt -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ci/windows-build-result.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Windows Actionsビルド結果を記録 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
