name: Step8 Gate0

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1
      - name: Install document helpers
        run: sudo apt-get update && sudo apt-get install -y zip zstd poppler-utils
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Full regression
        run: cargo test --offline --locked
      - name: Release build
        run: cargo build --offline --locked --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.97.1
        shell: powershell
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: GUI regression
        run: cargo test --offline --locked --test gui_search
      - name: Incremental regression
        run: cargo test --offline --locked --test incremental_index
      - name: Product lifecycle regression
        run: cargo test --offline --locked --test product_lifecycle
      - name: Windows watch regression
        run: cargo test --offline --locked --test windows_watch
      - name: Release build
        run: cargo build --offline --locked --release
