name: Self Delete Segment Write CI Branch

on:
  pull_request:
    branches:
      - ci/segment-write-breakdown-run

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary cleanup branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git --delete ci/segment-write-breakdown-run || true
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git --delete cleanup/segment-write-ci-pr || true
