name: Self Delete Segment Write CI Branch

on:
  push:
    branches:
      - ci/segment-write-breakdown-run

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary CI branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git --delete ci/segment-write-breakdown-run
