name: PR generation fast path gate

on:
  pull_request:
    branches:
      - feat/build-stage-diagnostics

permissions:
  contents: write

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Apply verified-generation fast path
        shell: pwsh
        run: |
          if (Test-Path ci/apply_verified_generation_fast_path.py) {
            python ci/apply_verified_generation_fast_path.py
            if ($LASTEXITCODE -ne 0) { throw "verified generation source transformation failed" }
            Remove-Item ci/apply_verified_generation_fast_path.py
            cargo fmt --manifest-path search-core/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw "search-core fmt failed" }
            cargo fmt --manifest-path bridge-core/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw "bridge-core fmt failed" }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "generation採用時の重複checksum検証を除去 [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          } else {
            Write-Host "Verified generation fast path is already applied."
          }

      - name: Run targeted safety tests
        shell: pwsh
        run: |
          cargo test --manifest-path search-core/Cargo.toml --test verified_generation_adoption
          if ($LASTEXITCODE -ne 0) { throw "verified generation targeted tests failed" }

      - name: Run full Windows verification and release build
        shell: powershell
        run: |
          .\scripts\verify-and-build-windows.ps1

      - name: Verify executable and calculate SHA-256
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\personalrag-tauri.exe"
          if (-not (Test-Path $exe)) {
            throw "Built executable not found: $exe"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "PersonalRag Windows executable SHA-256: $hash" | Out-File -FilePath windows-build-info.txt -Encoding utf8
          "### Windows release build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- executable: ``personalrag-tauri.exe``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PersonalRag-Windows-x64-generation-fast-path
          path: |
            src-tauri/target/release/personalrag-tauri.exe
            windows-build-info.txt
          if-no-files-found: error
          retention-days: 7
