name: Warm Cold Profile Gate

on:
  pull_request:
    branches: [main]

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Full Windows regression and release build
        shell: pwsh
        run: ./scripts/verify-and-build-windows.ps1
