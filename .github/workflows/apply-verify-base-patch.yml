name: Apply Verify Base Parallelism Patch

on:
  pull_request:
    types:
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.head.ref == 'perf/verify-base-parallelism'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: perf/verify-base-parallelism
          fetch-depth: 0

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('search-core/src/index.rs')
          text = path.read_text(encoding='utf-8')
          old = '''pub fn verify_index(root: impl AsRef<Path>) -> Result<()> {
              let workers = std::thread::available_parallelism()
                  .map_or(1, usize::from)
                  .min(4);
              let _ = PersistentIndex::open_with_workers(root, true, workers)?;
              Ok(())
          }

          #[cfg(test)]
          mod exact_matcher_simd_tests {
          '''
          new = '''const VERIFY_WORKER_CAP: usize = 8;

          fn verify_worker_count(logical_cpus: usize) -> usize {
              logical_cpus.max(1).min(VERIFY_WORKER_CAP)
          }

          pub fn verify_index(root: impl AsRef<Path>) -> Result<()> {
              let logical_cpus = std::thread::available_parallelism().map_or(1, usize::from);
              let workers = verify_worker_count(logical_cpus);
              let _ = PersistentIndex::open_with_workers(root, true, workers)?;
              Ok(())
          }

          #[cfg(test)]
          mod verify_worker_tests {
              use super::{VERIFY_WORKER_CAP, verify_worker_count};

              #[test]
              fn verify_worker_count_scales_above_legacy_cap_and_stays_bounded() {
                  assert_eq!(verify_worker_count(0), 1);
                  assert_eq!(verify_worker_count(1), 1);
                  assert_eq!(verify_worker_count(4), 4);
                  assert_eq!(verify_worker_count(8), 8);
                  assert_eq!(verify_worker_count(usize::MAX), VERIFY_WORKER_CAP);
              }
          }

          #[cfg(test)]
          mod exact_matcher_simd_tests {
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact verify_index block once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/ci-trigger/verify-base-parallelism-baseline.txt').unlink(missing_ok=True)
          PY

      - name: Targeted regression
        shell: bash
        run: |
          cargo fmt --manifest-path search-core/Cargo.toml -- --check
          cargo test --manifest-path search-core/Cargo.toml verify_worker_count_scales_above_legacy_cap_and_stays_bounded
          cargo test --manifest-path search-core/Cargo.toml checksum_and_truncation_corruption_are_rejected
          cargo test --manifest-path search-core/Cargo.toml checksum_gate_rejects_corrupt_segment_before_adoption

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'verify_baseのsegment checksum検証を最大8並列へ拡張'
          git push origin HEAD:perf/verify-base-parallelism
