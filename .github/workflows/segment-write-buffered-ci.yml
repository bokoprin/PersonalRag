name: Apply Buffered Segment Writer

on:
  pull_request:
    branches:
      - perf/segment-write-buffered

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: perf/segment-write-buffered
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Create deterministic A/B corpus
        shell: pwsh
        run: |
          $corpus = Join-Path $env:RUNNER_TEMP 'personalrag-write-ab-corpus'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $corpus
          New-Item -ItemType Directory -Force -Path $corpus | Out-Null
          1..256 | ForEach-Object {
            $prefix = 'PersonalRag segment write buffered AB file {0:D4} ' -f $_
            $body = $prefix + (('abcdefghijklmnopqrstuvwxyz0123456789-{0:D4}-' -f $_) * 3072)
            Set-Content -LiteralPath (Join-Path $corpus ('file-{0:D4}.txt' -f $_)) -Value $body -Encoding utf8
          }
          "PR_AB_CORPUS=$corpus" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Baseline warm profile
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'personalrag-write-ab-baseline'
          $log = Join-Path $env:RUNNER_TEMP 'personalrag-write-ab-baseline.log'
          ./scripts/profile-index-build.ps1 -Mode Warm -Root $env:PR_AB_CORPUS -HydrationWorkers 4 -BuildWorkers 4 -SegmentDocs 64 -OutputRoot $out -LogPath $log
          "PR_AB_BASELINE_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PR_AB_BASELINE_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply buffered writer
        shell: pwsh
        run: |
          python scripts/apply-segment-write-buffered.py
          cargo fmt --manifest-path search-core/Cargo.toml
          git diff --check
          git status --short

      - name: Targeted Search Core tests and clippy
        shell: pwsh
        run: |
          cargo test --manifest-path search-core/Cargo.toml
          cargo clippy --manifest-path search-core/Cargo.toml --all-targets -- -D warnings

      - name: Candidate warm profile
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'personalrag-write-ab-candidate'
          $log = Join-Path $env:RUNNER_TEMP 'personalrag-write-ab-candidate.log'
          ./scripts/profile-index-build.ps1 -Mode Warm -Root $env:PR_AB_CORPUS -HydrationWorkers 4 -BuildWorkers 4 -SegmentDocs 64 -OutputRoot $out -LogPath $log
          "PR_AB_CANDIDATE_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PR_AB_CANDIDATE_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Byte identity A/B
        shell: pwsh
        run: |
          function Get-TreeHashes([string]$root) {
            $map = @{}
            Get-ChildItem -LiteralPath $root -File -Recurse | ForEach-Object {
              $rel = [System.IO.Path]::GetRelativePath($root, $_.FullName)
              $map[$rel] = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            }
            return $map
          }
          $baselineRoot = Join-Path $env:PR_AB_BASELINE_OUT 'warm-measured'
          $candidateRoot = Join-Path $env:PR_AB_CANDIDATE_OUT 'warm-measured'
          $baseline = Get-TreeHashes $baselineRoot
          $candidate = Get-TreeHashes $candidateRoot
          $baselineKeys = @($baseline.Keys | Sort-Object)
          $candidateKeys = @($candidate.Keys | Sort-Object)
          if (($baselineKeys -join "`n") -ne ($candidateKeys -join "`n")) {
            throw 'Byte identity failed: output file sets differ'
          }
          foreach ($key in $baselineKeys) {
            if ($baseline[$key] -ne $candidate[$key]) {
              throw "Byte identity failed: $key differs"
            }
          }
          Write-Host "SEGMENT_WRITE_BUFFER_BYTE_IDENTITY_PASS files=$($baselineKeys.Count)"

      - name: Print A/B summary
        shell: pwsh
        run: |
          function Get-Measured([string]$path) {
            $line = Get-Content -LiteralPath $path | Where-Object { $_ -like 'PROFILE_RUN_JSON *' } | Select-Object -Last 1
            if (-not $line) { throw "PROFILE_RUN_JSON missing: $path" }
            return ($line.Substring('PROFILE_RUN_JSON '.Length) | ConvertFrom-Json)
          }
          $b = Get-Measured $env:PR_AB_BASELINE_LOG
          $c = Get-Measured $env:PR_AB_CANDIDATE_LOG
          [ordered]@{
            baselineBuildMs = $b.buildElapsedMs
            candidateBuildMs = $c.buildElapsedMs
            baselineWriteMs = $b.timings.segmentWriteWorkMs
            candidateWriteMs = $c.timings.segmentWriteWorkMs
            baselineWriteBodyMs = $b.timings.segmentWriteBodyWorkMs
            candidateWriteBodyMs = $c.timings.segmentWriteBodyWorkMs
            baselineWriteSyncMs = $b.timings.segmentWriteSyncWorkMs
            candidateWriteSyncMs = $c.timings.segmentWriteSyncWorkMs
          } | ConvertTo-Json -Compress | ForEach-Object { Write-Host "SEGMENT_WRITE_BUFFER_AB_JSON $_" }

      - name: Final full Windows regression and release build
        shell: pwsh
        run: ./scripts/verify-and-build-windows.ps1

      - name: Commit exact validated product tree
        shell: pwsh
        run: |
          git rm -f .github/workflows/segment-write-buffered-ci.yml
          git rm -f scripts/apply-segment-write-buffered.py
          git rm -f ci/segment-write-buffered-trigger.txt 2>$null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "segment writeを1MiBバッファリングしてOS write回数を削減"
          git push origin HEAD:perf/segment-write-buffered
          git rev-parse HEAD
