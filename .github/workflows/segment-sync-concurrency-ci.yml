name: Validate Segment Sync Concurrency

on:
  pull_request:
    branches:
      - perf/segment-sync-concurrency

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: perf/segment-sync-concurrency
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Gate 0 - Windows full regression before product change
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-and-build-windows.ps1
          git restore --worktree -- src-tauri/gen/schemas/desktop-schema.json src-tauri/gen/schemas/windows-schema.json
          git status --short

      - name: Create deterministic sync A/B corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $corpus = Join-Path $env:RUNNER_TEMP 'personalrag-sync-ab-corpus'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $corpus
          New-Item -ItemType Directory -Force -Path $corpus | Out-Null
          1..512 | ForEach-Object {
            $prefix = 'PersonalRag segment sync concurrency AB file {0:D4} ' -f $_
            $body = $prefix + (('abcdefghijklmnopqrstuvwxyz0123456789-{0:D4}-' -f $_) * 3072)
            [System.IO.File]::WriteAllText(
              (Join-Path $corpus ('file-{0:D4}.txt' -f $_)),
              $body,
              [System.Text.UTF8Encoding]::new($false)
            )
          }
          "PR_SYNC_AB_CORPUS=$corpus" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply sync concurrency implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/apply-segment-sync-concurrency.py
          if ($LASTEXITCODE -ne 0) { throw "sync concurrency patch failed: $LASTEXITCODE" }
          cargo fmt --manifest-path search-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed: $LASTEXITCODE" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }
          $builderDiff = git diff -- search-core/src/builder.rs
          if (-not $builderDiff) { throw 'builder.rs was not modified by sync concurrency patch' }
          git status --short

      - name: Search Core tests and clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path search-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed: $LASTEXITCODE" }
          cargo clippy --manifest-path search-core/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed: $LASTEXITCODE" }

      - name: Warm sync concurrency A/B 1-2-4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $records = @()
          $firstOutput = @{}
          $sequence = @(4, 1, 2, 2, 4, 1, 1, 2, 4)
          $iteration = 0
          foreach ($concurrency in $sequence) {
            $iteration++
            $out = Join-Path $env:RUNNER_TEMP ("personalrag-sync-ab-c{0}-r{1}" -f $concurrency, $iteration)
            $log = Join-Path $env:RUNNER_TEMP ("personalrag-sync-ab-c{0}-r{1}.log" -f $concurrency, $iteration)
            $env:PR_PROFILE_SEGMENT_SYNC_CONCURRENCY = [string]$concurrency
            ./scripts/profile-index-build.ps1 -Mode Warm -Root $env:PR_SYNC_AB_CORPUS -HydrationWorkers 4 -BuildWorkers 4 -SegmentDocs 64 -OutputRoot $out -LogPath $log
            if ($LASTEXITCODE -ne 0) { throw "profile failed for concurrency ${concurrency}: $LASTEXITCODE" }
            if (-not $firstOutput.ContainsKey($concurrency)) { $firstOutput[$concurrency] = $out }
            $line = Get-Content -LiteralPath $log | Where-Object { $_ -like 'PROFILE_RUN_JSON *' } | Select-Object -Last 1
            if (-not $line) { throw "PROFILE_RUN_JSON missing: $log" }
            $run = $line.Substring('PROFILE_RUN_JSON '.Length) | ConvertFrom-Json
            $records += [pscustomobject]@{
              concurrency = $concurrency
              buildMs = [double]$run.buildElapsedMs
              writeMs = [double]$run.timings.segmentWriteWorkMs
              bodyMs = [double]$run.timings.segmentWriteBodyWorkMs
              syncMs = [double]$run.timings.segmentWriteSyncWorkMs
              log = $log
            }
          }
          Remove-Item Env:PR_PROFILE_SEGMENT_SYNC_CONCURRENCY -ErrorAction SilentlyContinue

          function Get-Median([double[]]$values) {
            $sorted = @($values | Sort-Object)
            if ($sorted.Count % 2 -eq 1) { return [double]$sorted[[int]($sorted.Count / 2)] }
            $i = [int]($sorted.Count / 2)
            return ([double]$sorted[$i - 1] + [double]$sorted[$i]) / 2.0
          }

          $summary = @()
          foreach ($concurrency in @(1, 2, 4)) {
            $group = @($records | Where-Object concurrency -eq $concurrency)
            $summary += [pscustomobject]@{
              concurrency = $concurrency
              samples = $group.Count
              buildMedianMs = Get-Median ([double[]]@($group.buildMs))
              writeMedianMs = Get-Median ([double[]]@($group.writeMs))
              bodyMedianMs = Get-Median ([double[]]@($group.bodyMs))
              syncMedianMs = Get-Median ([double[]]@($group.syncMs))
            }
          }
          $summary | Sort-Object concurrency | ConvertTo-Json -Compress | ForEach-Object { Write-Host "SEGMENT_SYNC_AB_JSON $_" }
          $records | ConvertTo-Json -Compress | ForEach-Object { Write-Host "SEGMENT_SYNC_AB_SAMPLES_JSON $_" }

          function Get-TreeHashes([string]$root) {
            $map = @{}
            Get-ChildItem -LiteralPath $root -File -Recurse | ForEach-Object {
              $rel = [System.IO.Path]::GetRelativePath($root, $_.FullName)
              $map[$rel] = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            }
            return $map
          }
          $referenceRoot = Join-Path $firstOutput[4] 'warm-measured'
          $reference = Get-TreeHashes $referenceRoot
          foreach ($concurrency in @(1, 2)) {
            $candidateRoot = Join-Path $firstOutput[$concurrency] 'warm-measured'
            $candidate = Get-TreeHashes $candidateRoot
            $referenceKeys = @($reference.Keys | Sort-Object)
            $candidateKeys = @($candidate.Keys | Sort-Object)
            if (($referenceKeys -join "`n") -ne ($candidateKeys -join "`n")) {
              throw "Byte identity failed for sync concurrency ${concurrency}: file sets differ"
            }
            foreach ($key in $referenceKeys) {
              if ($reference[$key] -ne $candidate[$key]) {
                throw "Byte identity failed for sync concurrency ${concurrency}: $key differs"
              }
            }
          }
          Write-Host "SEGMENT_SYNC_BYTE_IDENTITY_PASS files=$($reference.Count)"

      - name: Final full Windows regression and release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-and-build-windows.ps1
          git restore --worktree -- src-tauri/gen/schemas/desktop-schema.json src-tauri/gen/schemas/windows-schema.json

      - name: Commit exact validated product tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm -f .github/workflows/segment-sync-concurrency-ci.yml
          git rm -f scripts/apply-segment-sync-concurrency.py
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed: $LASTEXITCODE" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "segment syncの並列数を制御してdurable write競合を抑制"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin HEAD:perf/segment-sync-concurrency
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
          git rev-parse HEAD
