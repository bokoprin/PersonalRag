name: PR q3 scratch reuse A-B

on:
  pull_request:
    branches:
      - perf/index-build-safe-speedups

permissions:
  contents: write

jobs:
  benchmark-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Materialize accepted candidate
        shell: pwsh
        run: |
          if (Test-Path ci/apply_q3_scratch_reuse.py) {
            python ci/apply_q3_scratch_reuse.py
            if ($LASTEXITCODE -ne 0) { throw 'q3 scratch reuse transform failed' }
            Remove-Item ci/apply_q3_scratch_reuse.py
            Remove-Item search-core/src/bin/pr_ab_core.rs -ErrorAction SilentlyContinue
            cargo fmt --manifest-path search-core/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw 'candidate fmt failed' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'candidate diff check failed' }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "q3 posting IDバッファを再利用して一時allocationを削減 [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          } else {
            Write-Host 'Accepted scratch reuse already materialized.'
          }

      - name: Install Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Targeted correctness
        shell: pwsh
        run: |
          cargo test --manifest-path search-core/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'search-core tests failed' }
          cargo clippy --manifest-path search-core/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'search-core clippy failed' }
