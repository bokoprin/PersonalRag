[package]
name = "personalrag-portable-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Production Rust port of the PersonalRag portable persistent search engine"
license = "MIT"

[lib]
name = "personalrag_portable_search"
path = "src/lib.rs"

[[bin]]
name = "pr_portable"
path = "src/bin/pr_portable.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

[profile.release]
# R15-R19 final binary-layout tournament (1/2/4/8): CGU=1 best preserved R14 hot paths
# while retaining PRPOS003 q9..q16 wins.
codegen-units = 1
