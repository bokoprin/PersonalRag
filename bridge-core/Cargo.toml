[package]
name = "personalrag-gui-bridge-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ignore = "0.4"
personalrag-portable-search = { path = "../search-core" }
regex = "1.11"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

[dev-dependencies]
serde_json = "1.0"
